# Einmalig: Datensatz „Zürich schaut hin“ ansehen (wird danach gelöscht)
name: Instagram-Namen prüfen
on:
  push:
    branches: [pruefen-namen]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Zürich schaut hin
        run: |
          curl -sL https://data.stadt-zuerich.ch/dataset/sid_zuerich_schaut_hin_od6001/download/BEV600OD6001.csv -o z.csv
          wc -l z.csv; head -5 z.csv
          python3 - <<'PY'
          import csv, collections
          rows = list(csv.DictReader(open('z.csv', encoding='utf-8-sig')))
          print(len(rows), 'Zeilen; Spalten:', list(rows[0].keys()))
          for k in rows[0].keys():
              c = collections.Counter(r[k] for r in rows)
              print(k, len(c), 'Werte, z. B.:', c.most_common(6))
          PY
