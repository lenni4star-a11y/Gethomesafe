# Nur zum Nachschauen, welche offenen Daten es für Linz gibt (wird danach wieder gelöscht)
name: Daten erkunden (Linz)
on:
  push:
    branches: [erkunden-linz]
jobs:
  look:
    runs-on: ubuntu-latest
    steps:
      - name: Bezirke
        run: |
          B=https://data.linz.gv.at/katalog/geodata
          curl -sL $B/statistisch_bezirke/2014/StatBez_Linz_EPSG_4326.gml -o g.gml; ls -la g.gml; head -c 2500 g.gml; echo; echo ...
          grep -oE '<[A-Za-z_:]+' g.gml | sort | uniq -c | sort -rn | head -30
          curl -sL $B/statistisch_bezirke/2014/statistische_bezirke.csv | head -25
          curl -sL $B/bezirke/Statistische_Bezirke_20250428.zip -o b.zip; unzip -l b.zip
      - name: WCs
        run: curl -sL "https://data.linz.gv.at/katalog/Freizeit/toiletten/WC_Anlagen.csv" | head -8
