# Nur zum Prüfen: App bauen und Screenshots machen (wird danach wieder gelöscht)
name: Daten erkunden
on:
  push:
    branches: [erkunden-linz]
permissions:
  contents: write
jobs:
  look:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: main
          path: app
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bauen
        working-directory: app
        run: npm ci && npm run build
      - name: Screenshots
        run: |
          cd app && (npx vite preview --port 4173 --strictPort > /tmp/preview.log 2>&1 &) && sleep 4
          npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
          mkdir -p ../ui/shots && cp ../ui/shot.mjs ./shot.mjs && node shot.mjs ../ui/shots
      - name: Hochladen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/shots && git commit -qm "Screenshots" && git push
